    <linearGradient id="topLeft" x1="72" y1="57" x2="128" y2="133" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f3fdff"/><stop offset="1" stop-color="#71d9ff"/></linearGradient>
    <linearGradient id="topRight" x1="184" y1="57" x2="128" y2="133" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a6c7ff"/><stop offset="1" stop-color="#6278f5"/></linearGradient>
