name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (requires a matching v* tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and project version
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        run: |
          $project = Select-String -Path CMakeLists.txt -Pattern 'project\(mwfl VERSION ([0-9.]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ("v$project" -ne "${{ github.ref_name }}") { throw "Tag does not match project version v$project" }
      - name: Configure
        run: cmake -S . -B build/release -G "Visual Studio 18 2026" -A x64 -DMWFL_BUILD_EXAMPLES=ON -DMWFL_BUILD_TESTS=ON
      - name: Build and test
        run: |
          cmake --build build/release --config Release --verbose
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -C Release -B artifacts
      - name: Create checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts -Filter *.zip -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one ZIP package, found $($packages.Count)"
          }
          $packages | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "artifacts/SHA256SUMS-x64.txt"
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mwfl-${{ github.sha }}-x64
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mwfl-${{ github.sha }}-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$(find artifacts -maxdepth 1 -name '*.zip' -type f -print -quit)"
          gh release create "${{ github.ref_name }}" \
            artifacts/*.zip artifacts/SHA256SUMS-*.txt \
            --generate-notes --verify-tag --repo "${{ github.repository }}"
