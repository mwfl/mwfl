name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x64:
    name: VS 2026 x64 ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: vs2026-x64-debug
          - configuration: Release
            preset: vs2026-x64-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Diagnose developer environment
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./scripts/doctor.ps1 -VisualStudio 2026

      - name: Configure
        run: cmake --preset vs2026-x64

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --verbose

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify documented developer workflow
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode Docs -VisualStudio 2026 -Jobs 2

  vs2022-compatibility:
    name: VS 2022 x64 Release compatibility
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diagnose developer environment
        shell: pwsh
        run: ./scripts/doctor.ps1 -VisualStudio 2022
      - name: Configure
        run: cmake --preset vs2022-x64
      - name: Build
        run: cmake --build --preset vs2022-x64-release --parallel
      - name: Test
        run: ctest --preset vs2022-x64-release

  clang-cl:
    name: clang-cl x64 Release compatibility
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and test with clang-cl
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual C++ build tools were not found' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          cmd /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:$($matches[1])" $matches[2] }
          }
          $clang = (Get-Command clang-cl -ErrorAction Stop).Source
          & $clang --version
          cmake -S . -B build/clang-cl -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER="$clang" -DMWFL_BUILD_EXAMPLES=ON `
            -DMWFL_BUILD_TESTS=ON -DMWFL_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/clang-cl --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/clang-cl -LE gui --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  optional-components:
    name: VS 2026 x64 optional components ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: vs2026-x64-optional-debug
          - configuration: Release
            preset: vs2026-x64-optional-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore pinned Scintilla downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/presets/vs2026-x64-optional/_deps/mwfl_scintilla_source-*
            build/presets/vs2026-x64-optional/_deps/mwfl_scintilla_binary-*
          key: scintilla-5.6.5-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}
      - name: Configure all optional components
        run: cmake --preset vs2026-x64-optional
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: >-
          ctest --preset ${{ matrix.preset }}
          --timeout 180
          --verbose

  reliability-repeat:
    name: Parser fuzz and lifecycle repeat
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake --preset vs2026-x64
      - name: Build reliability targets
        run: >-
          cmake --build --preset vs2026-x64-debug --parallel
          --target mwfl_session_parser_fuzz_test mwfl_resource_leak_test
          mwfl_lifecycle_test mwfl_advanced_lifecycle_test
      - name: Repeat reliability tests
        run: >-
          ctest --preset vs2026-x64-debug
          -R "mwfl\.(session_parser_fuzz|resource_leak|lifecycle\.|advanced\.)"
          --repeat until-fail:5

  static-analysis:
    name: VS 2026 MSVC static analysis
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure library
        run: >-
          cmake -S . -B build/analyze
          -G "Visual Studio 18 2026" -A x64
          -DMWFL_BUILD_EXAMPLES=OFF
          -DMWFL_BUILD_TESTS=OFF
          -DMWFL_WARNINGS_AS_ERRORS=ON
      - name: Analyze
        run: >-
          cmake --build build/analyze --config Debug --target mwfl --
          /p:Configuration=Debug
          /p:RunCodeAnalysis=true
          /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset

  address-sanitizer:
    name: VS 2026 MSVC AddressSanitizer
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build/asan
          -G "Visual Studio 18 2026" -A x64
          -DMWFL_BUILD_EXAMPLES=OFF -DMWFL_BUILD_TESTS=ON
          -DMWFL_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build/asan --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/asan -C Debug --output-on-failure

  coverage:
    name: Native source coverage
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build/coverage
          -G "Visual Studio 18 2026" -A x64
          -DMWFL_BUILD_EXAMPLES=ON -DMWFL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/coverage --config Debug --parallel
      - name: Locate coverage collector
        shell: pwsh
        run: |
          $collector = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18" `
            -Recurse -Filter Microsoft.CodeCoverage.Console.exe | Select-Object -First 1
          if (-not $collector) { throw 'Microsoft native code coverage collector was not found.' }
          "MWFL_COVERAGE_COLLECTOR=$($collector.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Collect coverage
        shell: pwsh
        run: >-
          & $env:MWFL_COVERAGE_COLLECTOR collect ctest
          --test-dir build/coverage -C Debug
          -E "mwfl\.(desktop|package_consumer|hot_corners_self_test)"
          --output-on-failure
          --output build/coverage/coverage.xml
          --output-format cobertura
      - name: Enforce coverage floor
        shell: pwsh
        run: >-
          ./tests/verify_coverage.ps1
          -Report build/coverage/coverage.xml
          -ProjectRoot .
          -MinimumPercent 74
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: build/coverage/coverage.xml
          if-no-files-found: error

  arm64:
    name: VS 2022 ARM64 Debug
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build/arm64
          -G "Visual Studio 17 2022" -A ARM64
          -DMWFL_BUILD_EXAMPLES=ON -DMWFL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/arm64 --config Debug --parallel
      - name: Test
        # The native ARM runner has no usable Explorer notification area, so
        # Shell_NotifyIcon returns ERROR_CANNOT_MAKE. These targets are still
        # built for ARM64; their real Shell protocol runs in both x64 matrices.
        run: >-
          ctest --test-dir build/arm64 -C Debug --output-on-failure
          -E 'mwfl\.(tray_icon_native|hot_corners_self_test)'
