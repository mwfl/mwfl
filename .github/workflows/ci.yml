name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x64:
    name: VS 2026 x64 ${{ matrix.configuration }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: vs2026-x64-debug
          - configuration: Release
            preset: vs2026-x64-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Diagnose developer environment
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./scripts/doctor.ps1 -VisualStudio 2026

      - name: Configure
        run: cmake --preset vs2026-x64

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --verbose

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify documented developer workflow
        if: matrix.configuration == 'Debug'
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode Docs -VisualStudio 2026 -Jobs 2

  vs2022-compatibility:
    name: VS 2022 x64 Release compatibility
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diagnose developer environment
        shell: pwsh
        run: ./scripts/doctor.ps1 -VisualStudio 2022
      - name: Configure
        run: cmake --preset vs2022-x64
      - name: Build
        run: cmake --build --preset vs2022-x64-release --parallel
      - name: Test
        run: ctest --preset vs2022-x64-release

  static-analysis:
    name: VS 2026 MSVC static analysis
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure library
        run: >-
          cmake -S . -B build/analyze
          -G "Visual Studio 18 2026" -A x64
          -DMWTL_BUILD_EXAMPLES=OFF
          -DMWTL_BUILD_TESTS=OFF
          -DMWTL_WARNINGS_AS_ERRORS=ON
      - name: Analyze
        run: >-
          cmake --build build/analyze --config Debug --target mwtl --
          /p:Configuration=Debug
          /p:RunCodeAnalysis=true
          /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset

  clang-cl:
    name: clang-cl x64 Release
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate Windows SDK manifest tool
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match '\\x64\\mt[.]exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe was not found.' }
          "MWTL_MT_TOOL=$($mt.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Configure
        run: >-
          cmake -S . -B build/clang-cl
          -G "Visual Studio 18 2026" -A x64 -T ClangCL
          -DCMAKE_MT="$env:MWTL_MT_TOOL"
          -DMWTL_BUILD_EXAMPLES=ON -DMWTL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/clang-cl --config Release --parallel
      - name: Test
        # The hosted image cannot reliably activate clang-cl GUI executables
        # (Win32 14001); the same GUI self-test runs in the MSVC matrices.
        run: >-
          ctest --test-dir build/clang-cl -C Release --output-on-failure
          -E 'mwtl\.(hot_corners_self_test|notepad_gui)'

  address-sanitizer:
    name: VS 2026 MSVC AddressSanitizer
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build/asan
          -G "Visual Studio 18 2026" -A x64
          -DMWTL_BUILD_EXAMPLES=OFF -DMWTL_BUILD_TESTS=ON
          -DMWTL_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build/asan --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/asan -C Debug --output-on-failure

  coverage:
    name: Native source coverage
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build/coverage
          -G "Visual Studio 18 2026" -A x64
          -DMWTL_BUILD_EXAMPLES=ON -DMWTL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/coverage --config Debug --parallel
      - name: Locate coverage collector
        shell: pwsh
        run: |
          $collector = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\18" `
            -Recurse -Filter Microsoft.CodeCoverage.Console.exe | Select-Object -First 1
          if (-not $collector) { throw 'Microsoft native code coverage collector was not found.' }
          "MWTL_COVERAGE_COLLECTOR=$($collector.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Collect coverage
        shell: pwsh
        run: >-
          & $env:MWTL_COVERAGE_COLLECTOR collect ctest
          --test-dir build/coverage -C Debug
          -E "mwtl\.(desktop|package_consumer|hot_corners_self_test)"
          --output-on-failure
          --output build/coverage/coverage.xml
          --output-format cobertura
      - name: Enforce coverage floor
        shell: pwsh
        run: >-
          ./tests/verify_coverage.ps1
          -Report build/coverage/coverage.xml
          -ProjectRoot .
          -MinimumPercent 74
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: build/coverage/coverage.xml
          if-no-files-found: error

  arm64:
    name: VS 2022 ARM64 Debug
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build/arm64
          -G "Visual Studio 17 2022" -A ARM64
          -DMWTL_BUILD_EXAMPLES=ON -DMWTL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/arm64 --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/arm64 -C Debug --output-on-failure
